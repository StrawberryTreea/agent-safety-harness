[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safety-harness"
version = "1.0.0"
description = "Source-derived Agent safety execution, private scoring and trace evaluation."
requires-python = ">=3.10"

[project.scripts]
ash = "agent_safety_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_safety_harness = ["data/*.jsonl"]
