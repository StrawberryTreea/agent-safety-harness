schema_name: llm_safety_canonical_v1
source_file: data/canonical.jsonl
version: 1.0.0
core_schema:
  description: 所有记录必须包含的统一核心字段（稳定 schema）
  required: true
  fields:
  - name: id
    type: str
    description: 全局唯一记录ID
  - name: dataset_name
    type: str
    description: 来源子数据集名称
  - name: source_id
    type: str
    description: 原始样本ID
  - name: test_text
    type: str
    description: 模型评测输入文本
  - name: reference_answer
    type: str
    description: 标准答案/标签
  - name: expected_behavior
    type: str
    description: 期望模型行为描述
  - name: l1_category
    type: str
    description: 一级类别
  - name: l2_category
    type: str
    description: 二级类别
  - name: eval_method
    type: str
    description: 评测方法（规则/模型评估等）
  - name: note
    type: str
    description: 补充说明字段
  - name: type
    type: str
    description: 题型（选择/判断/生成/填空等）
  - name: safety_l1_dimension
    type: str
    description: 安全一级维度
  - name: safety_l2_harm_type
    type: str
    description: 安全二级伤害类型
extended_schema:
  description: 按需出现的扩展字段（非所有记录必有）
  fields:
  - name: base_prompt
    type: str
    description: 原始基础提示词
  - name: benign_prompt
    type: str
    description: 表面正常提示词（常用于攻击/对照）
  - name: historical_target_response
    type: str
    description: 历史目标输出
  - name: image_path
    type: str
    description: 图像路径
  - name: pii_units
    type: str
    description: 隐私实体/脱敏单元
  - name: raw_choices
    type: list
    description: 原始选项列表
  - name: raw_history
    type: list
    description: 多轮对话历史
  - name: raw_input
    type: str
    description: 原始输入
  - name: raw_options
    type: list
    description: 原始选项集合
  - name: raw_post
    type: str
    description: 后置模板
  - name: raw_prompt
    type: str
    description: 原始prompt
  - name: raw_query
    type: str
    description: 原始query
  - name: raw_question
    type: str
    description: 原始问题
  - name: raw_test_text
    type: str
    description: 未清洗测试文本
  - name: redacted_query
    type: str
    description: 脱敏后的query
  - name: redteam_query
    type: str
    description: 红队攻击query
  - name: rubric
    type: list
    description: 评分标准
  - name: target_response
    type: str
    description: 目标输出
  - name: metadata
    type: dict
    description: Source provenance, transformations and evidence references.
schema_usage_guidelines:
- Thirteen core fields are required for labeled safety data.
- raw_* and metadata preserve source evidence.
- Optional fields require existence checks.
- The bundled LLM fixture has a minimal evaluator input contract and is not labeled
  safety data.
design_notes:
- Schema version does not assert a dataset population. Freeze count and SHA-256 separately
  for each experiment.
