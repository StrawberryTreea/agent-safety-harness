schema_usage_guidelines:
  - "核心字段（13个）用于所有统计、过滤、分类任务"
  - "raw_* 用于追溯原始数据来源"
  - "v2_* 用于分析转换链路与评测逻辑"
  - "redacted_query / pii_units 用于隐私分析"
  - "image_path / redteam_query 用于多模态与攻击样本分析"
  - "扩展字段必须做存在性判断，不可假设全量存在"

design_notes:
  - "该数据集为多shape混合结构，但核心schema完全稳定"
  - "扩展字段来自不同pipeline阶段（raw / v2 / redteam / privacy）"
  - "所有记录可统一依赖 core_schema 作为 canonical representation"