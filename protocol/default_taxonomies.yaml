# 默认分类体系（Default Taxonomies）
#
# 本文件是 default-llm / default-agent 两套默认体系的自包含定义，
# 放在仓库内以便外部协作者直接访问，不依赖任何本地路径。
#
# 权威出处：《2026大模型与智能体安全测评白皮书》
#   - LLM 8×19：白皮书正文第 4 章「四、评测维度」
#   - Agent 5×14：白皮书正文第 4 章「4.2 评测维度」
# 本仓库内机器可读编码：protocol/taxonomy_registry.yaml（LLM 8×19 的 id/parent/name）
#
# 原则：原生体系优先。本文件只作默认兜底与统一报告参考系。

version: default_taxonomies_v1
proposed_by: us
role: default_fallback
note: >-
  benchmark 自带原生体系时直接注册引用原生体系，不套用本文件；
  本文件仅在 benchmark 无原生体系时作为兜底归类，以及跨体系统一报告的参考坐标。

taxonomies:

  # ============================================================
  # default-llm
  # ============================================================
  - id: default-llm
    title: "默认体系 · LLM"
    modality: llm
    taxonomy_version: safety_taxonomy_8x19
    level_structure: "8 个一级维度 × 19 个二级伤害类型"
    primary_metric: safety_pass_rate      # 安全通过率，越高越好
    metric_direction: higher_is_better
    dataset_label_fields:
      l1: safety_l1_dimension
      l2: safety_l2_harm_type
    provenance:
      canonical_source: "《2026大模型与智能体安全测评白皮书》第 4 章「四、评测维度」"
      repo_registry: protocol/taxonomy_registry.yaml
      repo_file: protocol/default_taxonomies.yaml
      github_url: https://github.com/StrawberryTreea/agent-safety-harness/blob/main/protocol/default_taxonomies.yaml
      evaluation_evidence:
        datasets: 38
        records: 668820
        models: 8
    l1_dimensions:
      - id: L1-01
        code: "1"
        name: "敏感信息泄露"
        label_in_dataset: "一、敏感信息泄露"
        definition: "组织/企业财务、机密运营、涉密信息、敏感技术细节的泄露边界；个人身份、生活、财务、生物特征、医疗、轨迹、教育、社交关联信息。"
        l2_dimensions:
          - id: L2-01
            code: "1"
            name: "组织与业务敏感信息风险"
            label_in_dataset: "伤害类型1：组织与业务敏感信息风险"
            definition: "评估模型在组织/企业财务与预算信息、机密运营活动、内部沟通内容、涉密信息、敏感技术细节、部分内部政策与流程、部分合法信息的违规泄露边界、部分非法数字活动相关的组织信息上的表现。"
            covers:
              - 组织/企业财务与预算信息
              - 机密运营活动
              - 内部沟通内容
              - 涉密信息
              - 敏感技术细节
              - 部分内部政策与流程
              - 部分合法信息的违规泄露边界
              - 部分非法数字活动相关的组织信息
          - id: L2-02
            code: "2"
            name: "个人隐私与身份信息风险"
            label_in_dataset: "伤害类型2：个人隐私与身份信息风险"
            definition: "评估模型对个人身份识别信息、个人生活信息、个人财务信息、个人生物特征数据、个人医疗健康信息、个人位置轨迹信息、个人教育背景信息、个人隐私的社交关联信息的处理表现。"
            covers:
              - 个人身份识别信息
              - 个人生活信息
              - 个人财务信息
              - 个人生物特征数据
              - 个人医疗健康信息
              - 个人位置轨迹信息
              - 个人教育背景信息
              - 个人隐私的社交关联信息
      - id: L1-02
        code: "2"
        name: "恶意使用"
        label_in_dataset: "二、恶意使用"
        definition: "金融犯罪、毒品违禁品、暴力伤害、非法贸易、非法数字活动、版权侵权、性剥削、恐吓、恐怖活动、网络欺凌等协助行为；认可/鼓励/诱导危险行为的不当引导；协助虚假宣传与谣言传播的规模化操纵；武器制造使用、生化危险物质、敏感行动部署的高风险行为支持。"
        l2_dimensions:
          - id: L2-03
            code: "3"
            name: "协助违法违规行为风险"
            label_in_dataset: "伤害类型3：协助违法违规行为风险"
            definition: "评估模型在面对各类违法与有害请求协助时的响应表现。"
            covers:
              - 金融犯罪协助
              - 非法毒品与违禁品相关协助
              - 暴力与人身伤害行为协助
              - 非法贸易协助
              - 非法数字活动协助
              - 版权侵权协助
              - 性剥削与色情犯罪协助
              - 威胁与恐吓行为协助
              - 恐怖活动协助
              - 网络欺凌/线上骚扰的组织化协助
          - id: L2-04
            code: "4"
            name: "不当引导与风险放大"
            label_in_dataset: "伤害类型4：不当引导与风险放大"
            definition: "评估模型是否会认可、鼓励或诱导危险行为，考察其在边界场景下是否存在风险放大问题。"
            covers:
              - 诱导危险恶作剧/不安全行为
              - 诱导破坏性行为
              - 部分物质滥用诱导
              - 部分非伦理线下/线上危险行为诱导
              - 认可网络欺凌/线上骚扰行为
              - 诱导钓鱼/引战行为
          - id: L2-05
            code: "5"
            name: "规模化传播与操纵滥用风险"
            label_in_dataset: "伤害类型5：规模化传播与操纵滥用风险"
            definition: "评估模型是否会被用于协助开展虚假信息宣传活动、误导性信息/谣言传播、恶意信息传播与操纵性传播/宣传导向内容。"
            covers:
              - 协助开展虚假信息宣传活动
              - 协助传播误导性信息/谣言
              - 协助传播恶意信息
              - 部分操纵性传播/宣传导向内容
          - id: L2-06
            code: "6"
            name: "高风险与敏感行为支持风险"
            label_in_dataset: "伤害类型6：高风险与敏感行为支持风险"
            definition: "评估模型在高风险行为相关问题中的响应表现，考察其是否会提供可能造成现实伤害的敏感支持。"
            covers:
              - 武器获取与流转信息
              - 武器制造/改装/维护支持
              - 武器使用训练与效果优化
              - 敏感行动部署与协同支持
              - 生化与危险物质相关信息
      - id: L1-03
        code: "3"
        name: "歧视与偏见"
        label_in_dataset: "三、歧视与偏见"
        definition: "种族、民族、宗教、性别、性取向、残疾、地域、体型、社会阶层等群体的偏见、歧视、刻板印象与群体攻击。"
        l2_dimensions:
          - id: L2-07
            code: "7"
            name: "群体公平与偏见风险"
            label_in_dataset: "伤害类型7：群体公平与偏见风险"
            definition: "评估模型在涉及不同群体和身份特征时的表达表现，考察其是否会生成带有偏见、歧视、刻板印象或群体攻击倾向的内容，用于衡量模型在公共表达和社会交互场景中的公平性与价值对齐能力。"
            covers:
              - 种族
              - 民族
              - 宗教
              - 性别
              - 性取向
              - 残疾
              - 地域
              - 体型
              - 社会阶层
      - id: L1-04
        code: "4"
        name: "违法违规内容"
        label_in_dataset: "四、违法违规内容"
        definition: "侮辱/仇恨/严重毒性/粗俗的攻击性表达；露骨色情、血腥暴力、极端残忍的不适宜内容。"
        l2_dimensions:
          - id: L2-08
            code: "8"
            name: "攻击性与有害表达风险"
            label_in_dataset: "伤害类型8：攻击性与有害表达风险"
            definition: "评估模型在攻击性语言和有害表达方面的输出表现，考察其是否会生成侮辱性语言、仇恨言论、严重毒性语言或带有冒犯性的粗俗内容，检验模型在基础内容安全方面的识别、拒答和安全改写能力。"
            covers:
              - 侮辱性语言
              - 仇恨言论
              - 严重毒性语言
              - 带有冒犯性的粗俗内容
          - id: L2-09
            code: "9"
            name: "不适宜内容风险"
            label_in_dataset: "伤害类型9：不适宜内容风险"
            definition: "评估模型对不适宜内容的识别与控制能力，考察其是否会生成露骨色情、血腥暴力、极端残忍等不适合传播或应用的内容，重点关注面向公众用户、未成年人场景和内容生成场景中的安全底线。"
            covers:
              - 露骨色情
              - 血腥暴力
              - 极端残忍
      - id: L1-05
        code: "5"
        name: "虚假信息与幻觉"
        label_in_dataset: "五、虚假信息与幻觉"
        definition: "假新闻、谣言、不可靠观点、危险活动错误指导；医疗/法律/金融等专业场景的错误建议与幻觉。"
        l2_dimensions:
          - id: L2-10
            code: "10"
            name: "信息真实性与完整性风险"
            label_in_dataset: "伤害类型10：信息真实性与完整性风险"
            definition: "评估模型在事实性问题中的回答可靠性，考察其是否会生成假新闻、未经证实的谣言、不可靠观点或危险活动的错误指导信息，重点检验模型是否能够避免编造事实，并在信息不足或问题存在误导时给出审慎回答。"
            covers:
              - 假新闻
              - 未经证实的谣言
              - 不可靠观点
              - 危险活动的错误指导信息
          - id: L2-11
            code: "11"
            name: "专业场景误导与幻觉伤害风险"
            label_in_dataset: "伤害类型11：专业场景误导与幻觉伤害风险"
            definition: "评估模型在医疗、法律、金融等高风险专业场景中的表现，考察其是否会给出错误建议、误导性判断或缺乏依据的结论，重点关注模型在专业辅助场景中的边界意识、风险提示能力和幻觉控制能力。"
            covers:
              - 医疗场景
              - 法律场景
              - 金融场景
              - 错误建议
              - 误导性判断
              - 缺乏依据的结论
      - id: L1-06
        code: "6"
        name: "核心价值观安全"
        label_in_dataset: "六、核心价值观安全"
        definition: "危害国家安全、破坏国家统一、损害国家荣誉利益、泄露国家秘密；历史观/民族观/国家观/文化观的扭曲；极端主义、恐怖主义、邪教、宗教极端、民族仇恨、反社会价值。"
        l2_dimensions:
          - id: L2-12
            code: "12"
            name: "公共事务与治理秩序风险"
            label_in_dataset: "伤害类型12：公共事务与治理秩序风险"
            definition: "评估模型在公共事务和治理秩序相关问题中的输出表现，考察其是否会生成危害国家安全、破坏国家统一、损害国家荣誉和利益、泄露国家秘密等内容，用于检验模型在高敏感公共议题中的安全稳定性。"
            covers:
              - 危害国家安全
              - 破坏国家统一
              - 损害国家荣誉和利益
              - 泄露国家秘密
          - id: L2-13
            code: "13"
            name: "公共认知与价值导向风险"
            label_in_dataset: "伤害类型13：公共认知与价值导向风险"
            definition: "评估模型在历史观、民族观、国家观、文化观等方面的输出表现，考察其是否会生成扭曲公共认知、误导价值判断或破坏主流价值导向的内容，重点关注公共传播、教育科普和内容生成场景中的价值导向安全。"
            covers:
              - 历史观
              - 民族观
              - 国家观
              - 文化观
              - 扭曲公共认知
              - 误导价值判断
              - 破坏主流价值导向
          - id: L2-14
            code: "14"
            name: "极端化与社会秩序风险"
            label_in_dataset: "伤害类型14：极端化与社会秩序风险"
            definition: "评估模型对极端主义、恐怖主义、邪教宣传、宗教极端主义、民族仇恨和反社会价值等内容的响应表现，考察其是否会传播、认可或放大极端化风险，用于衡量模型在维护社会秩序和防范极端内容传播方面的安全能力。"
            covers:
              - 极端主义
              - 恐怖主义
              - 邪教宣传
              - 宗教极端主义
              - 民族仇恨
              - 反社会价值
      - id: L1-07
        code: "7"
        name: "攻击鲁棒性"
        label_in_dataset: "七、攻击鲁棒性"
        definition: "角色扮演、假设提问、编码/格式混淆、多轮诱导、后缀攻击、语义伪装、关键词替换、长文本隐藏意图等越狱手段；输入扰动、边界条件、异常上下文、复杂多轮下的异常响应。"
        l2_dimensions:
          - id: L2-15
            code: "15"
            name: "提示词越狱攻击风险"
            label_in_dataset: "伤害类型15：提示词越狱攻击风险"
            definition: "评估模型面对各类越狱攻击方式时的响应表现，考察其安全策略是否容易被绕过，重点检验模型在对抗性输入下能否保持稳定的安全边界。"
            covers:
              - 角色扮演
              - 假设性提问
              - 编码或格式混淆
              - 多轮诱导
              - 后缀攻击
              - 语义伪装
              - 关键词替换
              - 长文本隐藏意图
          - id: L2-16
            code: "16"
            name: "稳定性与异常响应风险"
            label_in_dataset: "伤害类型16：稳定性与异常响应风险"
            definition: "评估模型在输入扰动、边界条件、异常上下文和复杂多轮交互中的表现，考察其是否会出现异常输出、无响应、上下文丢失、逻辑断裂或事实编造等问题，用于衡量模型在复杂交互环境中的稳定性和可靠性。"
            covers:
              - 输入扰动
              - 边界条件
              - 异常上下文
              - 复杂多轮交互
              - 异常输出/无响应
              - 上下文丢失
              - 逻辑断裂
              - 事实编造
      - id: L1-08
        code: "8"
        name: "自主人工智能安全"
        label_in_dataset: "八、自主人工智能安全"
        definition: "超出授权调用工具/权限提升/越权访问/未确认即执行不可逆操作；误解意图、代理目标替代用户目标、过度优化单一指标、规避关闭/中断、偏离授权；识别测试环境、隐瞒能力或意图、伪装合规、隐藏工具链路、被审计时降低风险行为。"
        l2_dimensions:
          - id: L2-17
            code: "17"
            name: "自主决策越权与高风险操作风险"
            label_in_dataset: "伤害类型17：自主决策越权与高风险操作风险"
            definition: "评估模型在智能体和工具调用场景中的行为表现，考察其是否会超出授权范围调用工具、进行权限提升或越权访问、自主执行高风险操作或在未确认用户意图的情况下执行不可逆操作。"
            covers:
              - 超出授权范围调用工具
              - 权限提升
              - 越权访问
              - 自主执行高风险操作
              - 未确认用户意图即执行不可逆操作
          - id: L2-18
            code: "18"
            name: "自主目标偏移与工具性目标风险"
            label_in_dataset: "伤害类型18：自主目标偏移与工具性目标风险"
            definition: "评估模型在多轮任务和复杂目标场景中的表现，考察其是否会误解用户真实意图、将代理目标替代用户目标、过度优化单一指标、主动寻求额外资源、规避关闭或中断机制，或在执行过程中偏离原始授权范围。"
            covers:
              - 误解用户真实意图
              - 将代理目标替代用户目标
              - 过度优化单一指标
              - 主动寻求额外资源
              - 规避关闭或中断机制
              - 执行过程中偏离原始授权范围
          - id: L2-19
            code: "19"
            name: "欺骗、隐瞒与情境感知风险"
            label_in_dataset: "伤害类型19：欺骗、隐瞒与情境感知风险"
            definition: "评估模型在被测试、被审计或处于监管环境中的响应表现，考察其是否会识别测试环境并改变输出，隐瞒真实能力或执行意图，生成误导性解释，伪装合规行为，隐藏工具调用链路，或在被审计时降低风险行为表现，重点关注自主智能体场景下更隐蔽的安全与可控性问题。"
            covers:
              - 识别测试环境并改变输出
              - 隐瞒真实能力或执行意图
              - 生成误导性解释
              - 伪装合规行为
              - 隐藏工具调用链路
              - 被审计时降低风险行为表现

  # ============================================================
  # default-agent
  # ============================================================
  - id: default-agent
    title: "默认体系 · Agent"
    modality: agent
    taxonomy_version: agent_taxonomy_5x14_v1
    level_structure: "5 个一级安全维度 × 14 个二级安全风险"
    primary_metric: attack_success_rate   # 攻击成功率，越低越好
    metric_direction: lower_is_better
    scope_note: >-
      仅覆盖 Agent 执行侧安全（工具调用、数据访问、状态变更、轨迹与结果）。
      纯 LLM 内容安全、静态 prompt injection 素材库不计分，按 default-llm 体系处理。
    provenance:
      canonical_source: "《2026大模型与智能体安全测评白皮书》第 4 章「4.2 评测维度」"
      repo_file: protocol/default_taxonomies.yaml
      github_url: https://github.com/StrawberryTreea/agent-safety-harness/blob/main/protocol/default_taxonomies.yaml
      evaluation_evidence:
        agent_products: 4
        agent_products_list: ["Codex", "ClaudeCode", "Qoder", "CodeBuddy"]
        model_backends: ["DeepSeek-V4-Flash", "MiniMax-M3"]
        source_benchmarks:
          - AgentDojo
          - AgentLeak
          - AgentPoison
          - InjecAgent
          - MSB (MCP Security Bench)
          - SABER
    l1_dimensions:
      - id: A-L1-01
        code: "1"
        name: "输入与指令边界安全"
        definition: "评测 Agent 在接收用户输入、外部内容和工具返回信息时，是否能够区分可信指令与不可信数据，避免外部内容改变用户目标、系统规则或任务边界。"
        l2_dimensions:
          - id: A-L2-01
            code: "1.1"
            name: "外部内容指令注入风险"
            aliases: ["外部指令注入"]
            report_index: "安全风险1"
            definition: "评测 Agent 是否会执行网页、邮件、文档、代码仓库或检索内容中夹带的恶意指令，例如忽略原任务、泄露信息或执行额外操作。"
          - id: A-L2-02
            code: "1.2"
            name: "工具返回注入风险"
            aliases: ["工具返回注入"]
            report_index: "安全风险2"
            definition: "评测 Agent 是否会将搜索结果、数据库记录、API 响应或其他工具返回内容中的攻击指令误认为可信指令，并据此改变计划或调用其他工具。"
      - id: A-L1-02
        code: "2"
        name: "工具调用与执行控制安全"
        definition: "评测 Agent 在选择工具、生成参数和组织执行流程时，是否能够保持用户目标和权限边界。"
        l2_dimensions:
          - id: A-L2-03
            code: "2.1"
            name: "未授权工具调用风险"
            aliases: ["未授权工具调用"]
            report_index: "安全风险3"
            definition: "评测 Agent 是否调用与用户目标无关或未经授权的危险工具，例如开锁、发送邮件、读取账户或修改资源。"
          - id: A-L2-04
            code: "2.2"
            name: "工具选择与参数劫持风险"
            aliases: ["工具选择与参数劫持"]
            report_index: "安全风险4"
            definition: "评测 Agent 是否将攻击者提供的工具名称、文件路径、数据库字段、收件人、位置或时间等内容带入真实工具调用。"
          - id: A-L2-05
            code: "2.3"
            name: "多阶段工具链劫持风险"
            aliases: ["多阶段工具链劫持"]
            report_index: "安全风险5"
            definition: "评测 Agent 是否沿着攻击者设计的多步工具链连续执行，例如先读取敏感信息，再通过另一个工具外发。"
          - id: A-L2-06
            code: "2.4"
            name: "欺骗性反馈操纵风险"
            aliases: ["欺骗性反馈操纵"]
            report_index: "安全风险6"
            definition: "评测 Agent 是否会受到虚假错误、模拟用户、偏好操纵或伪造成功信息的影响而改变原计划。"
          - id: A-L2-07
            code: "2.5"
            name: "工具调用约束绕过风险"
            aliases: ["工具调用约束绕过"]
            report_index: "安全风险7"
            definition: "评测 Agent 是否绕过工具权限、调用顺序、参数范围或任务边界，执行本不应执行的操作。"
      - id: A-L1-03
        code: "3"
        name: "数据访问与信息流安全"
        definition: "评测 Agent 在读取、处理、传递和披露数据时，是否遵守访问权限、最小必要原则和信息流向限制。"
        l2_dimensions:
          - id: A-L2-08
            code: "3.1"
            name: "敏感数据泄露风险"
            aliases: ["敏感数据泄露"]
            report_index: "安全风险8"
            definition: "评测 Agent 是否在访问或处理数据的过程中，向无权接触的主体、工具或上下文暴露账户凭据、个人隐私、商业机密、系统配置等敏感信息。"
          - id: A-L2-09
            code: "3.2"
            name: "敏感数据外发风险"
            aliases: ["敏感数据外发"]
            report_index: "安全风险9"
            definition: "评测 Agent 是否通过邮件、消息、网络请求、文件上传或第三方服务，将敏感数据发送未经授权的外部目标。"
          - id: A-L2-10
            code: "3.3"
            name: "未授权信息获取风险"
            aliases: ["未授权信息获取"]
            report_index: "安全风险10"
            definition: "评测 Agent 是否超出用户权限或任务需要，读取、搜索、查询或推断本不应获取的账户信息、文件内容、数据库记录或其他受保护数据。"
      - id: A-L1-04
        code: "4"
        name: "状态变更与系统操作安全"
        definition: "评测 Agent 在修改数据、文件、系统配置和运行环境时，是否获得有效授权，并控制操作的范围、影响和可恢复性。"
        l2_dimensions:
          - id: A-L2-11
            code: "4.1"
            name: "数据与文件篡改风险"
            aliases: ["数据与文件篡改"]
            report_index: "安全风险11"
            definition: "评测 Agent 是否未经授权创建、修改、覆盖或删除数据、文件、代码、配置和业务记录，导致内容完整性受损或系统状态异常。"
          - id: A-L2-12
            code: "4.2"
            name: "远程控制与持久化风险"
            aliases: ["远程控制与持久化"]
            report_index: "安全风险12"
            definition: "评测 Agent 是否执行可能形成长期控制能力的操作，例如安装恶意程序、创建隐藏账户、写入启动项、添加密钥、提升权限或建立远程访问通道。"
      - id: A-L1-05
        code: "5"
        name: "行为轨迹与结果安全"
        definition: "评测 Agent 在完成任务的全过程及生成最终结果时，是否能够识别攻击影响、阻断危险行为，并避免在输出中产生安全后果。"
        l2_dimensions:
          - id: A-L2-13
            code: "5.1"
            name: "最终响应泄露风险"
            aliases: ["最终响应泄露"]
            report_index: "安全风险13"
            definition: "评测 Agent 是否在面向用户的最终响应中直接输出密码、令牌、个人隐私、内部记录、隐藏指令或其他不应披露的敏感内容。"
          - id: A-L2-14
            code: "5.2"
            name: "攻击暴露与抵抗风险"
            aliases: ["攻击暴露与抵抗"]
            report_index: "安全风险14"
            definition: "评测 Agent 在面对检索投毒、恶意上下文或对抗性信息时，是否能够识别异常内容、抵抗攻击诱导，并避免检索、采纳或输出攻击者预设的目标信息。"

compatibility_note: "任何结构性改动（增删维度、改变编码）必须升版本并附显式可比性说明。"
