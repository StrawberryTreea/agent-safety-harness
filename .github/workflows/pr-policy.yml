name: PR 规范门禁
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  title-and-branch:
    name: PR 标题与分支名
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|test|refactor|perf|chore|build|ci)(\([^)]+\))?!?: .+'; then
            echo "::error title=PR 标题格式不合规：$TITLE"
            echo "::error title=要求 type(scope): 描述，例如 feat(engine): 接通 bench_intake 到 source_intake"
            exit 1
          fi
      - name: 校验源分支名
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if ! echo "$BRANCH" | grep -qE '^(feat|fix|docs|test|refactor|perf|chore|ci)/[a-z0-9._-]+$'; then
            echo "::error title=源分支名不合规：$BRANCH"
            echo "::error title=要求 type/小写短横线名，例如 feat/registry-real-engine"
            exit 1
          fi

  secrets:
    name: 泄密扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 扫描新增行中的密钥模式
        run: |
          set +e
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -nE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if [ $? -eq 0 ]; then
            echo "::error title=检测到疑似密钥，请撤销该行并改用 api_key_env 环境变量"
            exit 1
          fi
          exit 0
      - name: 扫描新增行中的本机绝对路径与内网地址
        run: |
          set +e
          # 说明：下面三个正则刻意用字符组而不是反斜杠转义，
          # 既能匹配 Windows 的 C:\Users\ 和 POSIX 的 /home/，
          # 又不会让本文件自身的正则字面量被自己命中。
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -nE '(C:[\\/]+Users[\\/]+[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/|/nfs[-]data|a100[-]p[0-9]+|(10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|211\.81\.55\.[0-9]{1,3})'
          if [ $? -eq 0 ]; then
            echo "::error title=检测到本机绝对路径或内网地址，公开仓库不允许提交这些内容"
            exit 1
          fi
          exit 0
      - name: 扫描新增行中的真实邮箱
        run: |
          set +e
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -nE '[A-Za-z0-9._%+-]+@(qq|gmail|163|126|outlook|hotmail|sina)\.(com|cn)'
          if [ $? -eq 0 ]; then
            echo "::error title=检测到个人邮箱，请移除或改用 GitHub 用户名（如 @321ddi）"
            exit 1
          fi
          exit 0

  contract-touch:
    name: 契约变更需王浩评审
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查是否触碰契约文件
        run: |
          set +e
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^(harness/src/agent_safety_harness/(schema|registry)\.py|protocol/|docs/FRAMEWORK_CONTRACT\.md)$'
          if [ $? -eq 0 ]; then
            echo "::notice title=本 PR 触碰契约文件，CODEOWNERS 会自动要求 @StrawberryTreea 批准"
          fi
          exit 0
