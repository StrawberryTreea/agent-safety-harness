name: Portable checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repo.py --out runs/ci-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-logs
          path: runs/ci-check/

  oncall-roster:
    name: 在岗与代理覆盖度
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 检查名册与 CODEOWNERS 覆盖度
        run: |
          python scripts/oncall_roster.py --out runs/oncall --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oncall-report
          path: runs/oncall/

  doc-map:
    name: 文档地图一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 检查地图清单与实际文档一致
        run: |
          python scripts/check_doc_map.py
