evaluator_config:
  input_jsonl: data/canonical.jsonl
  run_root: runs/llm-experiment
  run_mode: api
  resume: true
  aggregate_latest_by_id: true
  rerun_api_errors: true
  models:
    - name: my_model
      provider: openai_compatible
      enabled: true
      api_key_env: EVAL_API_KEY
      base_url: https://api.example.com/v1
      model: replace-with-pinned-model-id
      max_workers: 1
      rpm: 30
      tpm: 10000
